[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openleo-link"
version = "0.3.0"
description = "Reproducible LEO constellation, adaptive-link and routing experiments with a 3D workbench"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "skyfield>=1.55",
    "numpy>=1.26",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11"]

[project.scripts]
openleo = "openleo.cli:main"

[dependency-groups]
dev = [
    "build>=1.3",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]
browser = ["playwright==1.58.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/openleo"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.*",
    "/coverage.xml",
    "/runs/",
    "/dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
