name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            full-checks: true
          - os: macos-latest
            python-version: "3.12"
            full-checks: false
          - os: windows-latest
            python-version: "3.12"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.13"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.14"
            full-checks: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --group dev --extra plot

      - run: uv run ruff check src tests

      - run: uv run ruff format --check src tests

      - run: uv run pytest --cov=openleo --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - if: matrix.full-checks
        run: uv run python -m build

      - if: matrix.full-checks
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {len(archives)}")
          forbidden = {".coverage", "coverage.xml", "runs", "dist"}
          with tarfile.open(archives[0], "r:gz") as archive:
              invalid = [
                  member.name
                  for member in archive.getmembers()
                  if PurePosixPath(member.name).is_absolute()
                  or forbidden.intersection(PurePosixPath(member.name).parts)
              ]
          if invalid:
              raise SystemExit(f"invalid sdist members: {invalid}")
          print(f"sdist members clean: {archives[0]}")
          PY

      - run: uv run openleo run examples/scenarios/iss_cartagena.json --output runs/iss

      - run: uv run openleo plot runs/iss --output runs/iss/pass-overview.svg

      - if: matrix.full-checks
        run: uv run openleo plot runs/iss --output docs/images/iss-cartagena-pass-overview.svg

      - if: matrix.full-checks
        run: git diff --exit-code -- docs/images/iss-cartagena-pass-overview.svg
