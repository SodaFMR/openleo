name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            full-checks: true
          - os: macos-latest
            python-version: "3.12"
            full-checks: false
          - os: windows-latest
            python-version: "3.12"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.13"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.14"
            full-checks: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --group dev --extra plot

      - run: uv run ruff check src tests

      - run: uv run ruff format --check src tests

      - run: uv run pytest --cov=openleo --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - run: uv run openleo constellation examples/constellations/iridium_global.json --output runs/global

      - run: uv run python -c "from openleo.workbench import load_experiment; assert len(load_experiment('runs/global')['satellites']) == 80"

      - run: uv run openleo constellation examples/constellations/iridium_global_reference.json --output runs/global-reference

      - run: uv run python -c "from openleo.workbench import load_experiment; d = load_experiment('runs/global-reference'); assert d['schema_version'] == '2' and len(d['satellites']) == 80 and any(d['links'])"

      - run: uv run openleo fidelity-study examples/studies/reference_fidelity.json --output runs/fidelity

      - run: uv run python -c "from openleo.fidelity_io import load_fidelity_result; d = load_fidelity_result('runs/fidelity'); assert len(d['runs']) == 18 and len(d['station_metrics']) == 72 and len(d['route_metrics']) == 54"

      - run: uv run openleo hydrometeors examples/atmosphere/hydrometeors_reference.json --output runs/hydrometeors

      - run: uv run openleo constellation examples/constellations/iridium_global_hydrometeors.json --output runs/coupled

      - run: uv run openleo experiment examples/constellations/iridium_global_hydrometeors.json --duration-s 120 --output runs/experiment

      - run: uv run openleo verify-orbit examples/validation/vallado_06251.json

      - name: Prepare a short reference-atmosphere study
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path

          path = Path("examples/constellations/iridium_global_reference.json")
          original = json.loads(path.read_text(encoding="utf-8"))
          stop = datetime.fromisoformat(original["time_window"]["start_utc"]) + timedelta(minutes=1)
          scenario = {
              **original,
              "orbit": {**original["orbit"], "path": (path.parent / original["orbit"]["path"]).resolve().as_posix()},
              "time_window": {**original["time_window"], "stop_utc": stop.isoformat().replace("+00:00", "Z")},
          }
          Path("runs/reference-study-scenario.json").write_text(json.dumps(scenario), encoding="utf-8")
          PY

      - run: uv run openleo propagation-study runs/reference-study-scenario.json --output runs/reference-study --figure runs/reference-study/comparison.svg

      - name: Validate reference-atmosphere study artifacts
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          from openleo.workbench import load_experiment

          directory = Path("runs/reference-study")
          for name, schema in (("free_space", "1"), ("reference", "2"), ("refined", "2")):
              document = load_experiment(directory / name)
              assert document["schema_version"] == schema
          summary = json.loads((directory / "propagation-study.json").read_text(encoding="utf-8"))
          assert summary["comparison"]["link_count"] > 0
          assert (directory / "comparison.csv").is_file()
          assert ElementTree.parse(directory / "comparison.svg").getroot().tag.endswith("svg")
          PY

      - if: matrix.full-checks
        run: node --test tests/test_workbench_ui.mjs

      - if: matrix.full-checks
        run: uv run --group browser --extra plot playwright install --with-deps chromium

      - if: matrix.full-checks
        run: uv run --group browser --extra plot python tests/browser_workbench.py

      - if: matrix.full-checks
        run: uv run --group browser --extra plot python tests/browser_workbench.py --scenario examples/constellations/iridium_global_reference.json

      - if: matrix.full-checks
        run: uv run --group browser --extra plot python tests/browser_workbench.py --scenario examples/constellations/iridium_global_hydrometeors.json

      - if: matrix.full-checks
        run: uv run --group browser --extra plot python tests/browser_fidelity.py runs/fidelity

      - if: matrix.full-checks
        run: uv run --group browser --extra plot python tests/browser_experiment.py

      - if: matrix.full-checks
        run: uv run python -m build

      - if: matrix.full-checks
        run: uvx cffconvert==2.0.0 --validate

      - if: matrix.full-checks
        shell: bash
        run: |
          audit_requirements="$(mktemp)"
          uv export --quiet --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$audit_requirements"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$audit_requirements"

      - if: matrix.full-checks
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {len(archives)}")
          forbidden = {"coverage.xml", "dist", "runs"}
          with tarfile.open(archives[0], "r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              invalid = [
                  member.name
                  for member in members
                  if (path := PurePosixPath(member.name)).is_absolute()
                  or (
                      len(path.parts) > 1
                      and path.parts[1].startswith(".")
                      and path.parts[1] != ".gitignore"
                  )
                  or forbidden.intersection(path.parts)
              ]
          if invalid:
              raise SystemExit(f"invalid sdist members: {invalid}")
          if not any(name.endswith("/THIRD_PARTY_NOTICES.md") for name in names):
              raise SystemExit("sdist is missing THIRD_PARTY_NOTICES.md")
          if any("/adapters/ns3/" in name for name in names):
              raise SystemExit("GPL adapter must not be bundled in the MIT core sdist")

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = wheel.namelist()
          if any("adapters/ns3/" in name for name in wheel_names):
              raise SystemExit("GPL adapter must not be bundled in the MIT core wheel")
          required_notices = (
              ".dist-info/licenses/LICENSE",
              ".dist-info/licenses/THIRD_PARTY_NOTICES.md",
          )
          missing_notices = [
              notice
              for notice in required_notices
              if not any(name.endswith(notice) for name in wheel_names)
          ]
          if missing_notices:
              raise SystemExit(f"wheel is missing license notices: {missing_notices}")
          required_assets = {
              "openleo/_web/workbench.html", "openleo/_web/workbench.css",
              "openleo/_web/workbench.js", "openleo/_web/coastline.geojson",
          }
          if not required_assets.issubset(wheel_names):
              raise SystemExit(f"wheel missing workbench assets: {required_assets - set(wheel_names)}")
          print(f"distribution members clean: {archives[0]}, {wheels[0]}")
          PY

      - if: matrix.full-checks
        shell: bash
        run: |
          core_env="$(mktemp -d)/venv"
          uv venv --python 3.12 "$core_env"
          uv pip install --python "$core_env/bin/python" dist/*.whl
          "$core_env/bin/python" - <<'PY'
          import importlib.util

          if importlib.util.find_spec("matplotlib") is not None:
              raise SystemExit("Matplotlib unexpectedly present in core-only wheel environment")
          print("core-only wheel environment has no Matplotlib")
          PY
          "$core_env/bin/openleo" sensitivity \
            examples/scenarios/iss_cartagena.json \
            examples/sensitivity/iss_cartagena_oat.json \
            --output "$core_env/sensitivity"
          "$core_env/bin/openleo" gases \
            examples/atmosphere/p676_13_validation.json \
            --output "$core_env/gases"
          "$core_env/bin/openleo" constellation \
            examples/constellations/iridium_global.json \
            --output "$core_env/constellation"
          "$core_env/bin/openleo" constellation \
            examples/constellations/iridium_global_reference.json \
            --output "$core_env/constellation-reference"
          "$core_env/bin/openleo" propagation-study \
            runs/reference-study-scenario.json \
            --output "$core_env/reference-study"
          "$core_env/bin/openleo" fidelity-study \
            examples/studies/reference_fidelity.json \
            --output "$core_env/fidelity"
          "$core_env/bin/openleo" hydrometeors \
            examples/atmosphere/hydrometeors_reference.json \
            --output "$core_env/hydrometeors"
          "$core_env/bin/openleo" experiment \
            examples/constellations/iridium_global_hydrometeors.json \
            --duration-s 120 --output "$core_env/experiment"
          "$core_env/bin/openleo" verify-orbit examples/validation/vallado_06251.json

      - run: uv run openleo run examples/scenarios/iss_cartagena.json --output runs/iss

      - run: uv run openleo plot runs/iss --output runs/iss/pass-overview.svg

      - run: uv run openleo sensitivity examples/scenarios/iss_cartagena.json examples/sensitivity/iss_cartagena_oat.json --output runs/iss-sensitivity

      - run: uv run openleo plot-sensitivity runs/iss-sensitivity --output runs/iss-sensitivity/sensitivity-overview.svg

      - run: uv run openleo gases examples/atmosphere/p676_13_validation.json --output runs/p676-validation

      - run: uv run openleo plot-gases runs/p676-validation --output runs/p676-validation/p676-13-specific-attenuation.svg

      - if: matrix.full-checks
        run: uv run openleo plot runs/iss --output docs/images/iss-cartagena-pass-overview.svg

      - if: matrix.full-checks
        run: uv run openleo plot-sensitivity runs/iss-sensitivity --output docs/images/iss-cartagena-sensitivity-overview.svg

      - if: matrix.full-checks
        run: uv run openleo plot-gases runs/p676-validation --output docs/images/p676-13-specific-attenuation.svg

      - if: matrix.full-checks
        run: uv run openleo propagation-study examples/constellations/iridium_global_reference.json --output runs/reference-study-full --figure runs/reference-study-full/comparison.svg

      - if: matrix.full-checks
        run: uv run python tests/check_propagation_figure.py docs/images/reference-propagation-ablation.svg runs/reference-study-full/comparison.svg

      - if: matrix.full-checks
        run: git diff --exit-code -- examples/atmosphere/p676_13_validation.json docs/images/iss-cartagena-pass-overview.svg docs/images/iss-cartagena-sensitivity-overview.svg docs/images/p676-13-specific-attenuation.svg

  packet-replay:
    name: ns-3.48 / analytical packet replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Install compiler and build tools
        run: sudo apt-get update && sudo apt-get install -y g++-14 cmake ninja-build
      - name: Build the pinned optional backend
        env:
          CXX: g++-14
        run: |
          git clone --depth 1 --branch ns-3.48 https://gitlab.com/nsnam/ns-3-dev.git "$RUNNER_TEMP/ns-3.48"
          test "$(git -C "$RUNNER_TEMP/ns-3.48" rev-parse HEAD)" = d2add90b452d600cfb4859baed8e9ea633519447
          cp adapters/ns3/openleo-replay.cc "$RUNNER_TEMP/ns-3.48/scratch/openleo-replay.cc"
          cp adapters/ns3/openleo-network-replay.cc "$RUNNER_TEMP/ns-3.48/scratch/openleo-network-replay.cc"
          cp adapters/ns3/replay-common.h "$RUNNER_TEMP/ns-3.48/scratch/replay-common.h"
          cd "$RUNNER_TEMP/ns-3.48"
          ./ns3 configure --build-profile=release --enable-modules='core;network;internet;point-to-point;applications' --enable-build-version --enable-examples --enable-tests --disable-python-bindings --disable-precompiled-headers --disable-gtk --disable-gsl --disable-werror
          ./ns3 build openleo-replay -j 2
          ./ns3 build openleo-network-replay -j 2
          build/scratch/ns3.48-openleo-replay --PrintVersion
          build/scratch/ns3.48-openleo-network-replay --PrintVersion
      - name: Verify real packet event semantics
        run: uv run python tests/ns3_replay_checks.py "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay"
      - name: Verify native multi-hop event semantics
        run: uv run python tests/ns3_network_checks.py "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay"
      - name: Verify Python-to-simulator integration
        run: OPENLEO_NS3_REPLAY="$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay" OPENLEO_NS3_NETWORK="$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay" uv run pytest tests/test_packet_replay.py tests/test_packet_cli.py tests/test_network_replay.py tests/test_experiment.py tests/test_benchmark.py tests/test_release_evidence.py
      - name: Replay an archived-orbit model trace
        run: |
          uv run openleo constellation examples/constellations/iridium_global_reference.json --output runs/packet-source
          uv run openleo packet-replay runs/packet-source --station Madrid --norad 42960 --duration-s 300 --backend "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay" --output runs/packets
          uv run python -c "import json; from pathlib import Path; d=json.loads(Path('runs/packets/packet-summary.json').read_text()); assert len(d['directions']) == 2; assert sum(r['offered_packets'] for r in d['directions']) > 0"
          uv run openleo network-replay runs/packet-source --duration-s 300 --flows-per-direction 2 --acquisition-delay-s 0.1 --backend "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay" --output runs/network-packets
