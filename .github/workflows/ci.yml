name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            full-checks: true
          - os: macos-latest
            python-version: "3.12"
            full-checks: false
          - os: windows-latest
            python-version: "3.12"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.13"
            full-checks: false
          - os: ubuntu-latest
            python-version: "3.14"
            full-checks: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --all-extras --group dev

      - run: uv run ruff check src tests scripts

      - run: uv run ruff format --check src tests scripts

      - run: uv run pytest --cov=openleo --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Validate the example scenarios
        shell: bash
        run: |
          for scenario in examples/constellations/*.json examples/scenarios/*.json examples/performance/*.json; do
            uv run openleo scenario validate "$scenario"
          done

      - run: uv run openleo run examples/constellations/iridium_global.json --output runs/global

      - run: uv run openleo run examples/constellations/iridium_global_hydrometeors.json --output runs/coupled

      - run: uv run openleo sweep examples/sweeps/propagation_cases.json --output runs/cases

      - run: uv run openleo verify orbit examples/validation/vallado_06251.json

      - run: uv run openleo calc gases examples/atmosphere/p676_13_validation.json --output runs/gases

      - run: uv run openleo calc hydrometeors examples/atmosphere/hydrometeors_reference.json --output runs/hydro

      - run: uv run openleo report runs/coupled --output runs/coupled-report --figures

      - run: uv run openleo report runs/cases --output runs/cases-report

      - name: Cross-platform numeric agreement with the Ubuntu digest (spec sections 7.5 and 11)
        run: uv run python scripts/compare_results.py runs/coupled tests/fixtures/ci/coupled-ubuntu.json

      - if: matrix.full-checks
        name: The migration table is current
        run: uv run python scripts/migration_table.py --check

      - if: matrix.full-checks
        name: The published gas figure is reproducible
        run: |
          uv run python -c "from openleo.calc.gases_figure import render_gases_overview; render_gases_overview('runs/gases', 'docs/images/p676-13-specific-attenuation.svg')"
          git diff --exit-code -- docs/images/p676-13-specific-attenuation.svg

      - if: matrix.full-checks
        run: uv run python -m build

      - if: matrix.full-checks
        run: uvx cffconvert==2.0.0 --validate

      - if: matrix.full-checks
        shell: bash
        run: |
          audit_requirements="$(mktemp)"
          uv export --quiet --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$audit_requirements"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$audit_requirements"

      - if: matrix.full-checks
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {len(archives)}")
          forbidden = {"coverage.xml", "dist", "runs"}
          with tarfile.open(archives[0], "r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              invalid = [
                  member.name
                  for member in members
                  if (path := PurePosixPath(member.name)).is_absolute()
                  or (
                      len(path.parts) > 1
                      and path.parts[1].startswith(".")
                      and path.parts[1] != ".gitignore"
                  )
                  or (len(path.parts) > 1 and path.parts[1] in forbidden)
              ]
          if invalid:
              raise SystemExit(f"invalid sdist members: {invalid}")
          if not any(name.endswith("/THIRD_PARTY_NOTICES.md") for name in names):
              raise SystemExit("sdist is missing THIRD_PARTY_NOTICES.md")
          if any("/adapters/ns3/" in name for name in names):
              raise SystemExit("GPL adapter must not be bundled in the MIT core sdist")

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = wheel.namelist()
          if any("adapters/" in name for name in wheel_names):
              raise SystemExit("adapters must not be bundled in the MIT core wheel")
          required_notices = (
              ".dist-info/licenses/LICENSE",
              ".dist-info/licenses/THIRD_PARTY_NOTICES.md",
          )
          missing_notices = [
              notice
              for notice in required_notices
              if not any(name.endswith(notice) for name in wheel_names)
          ]
          if missing_notices:
              raise SystemExit(f"wheel is missing license notices: {missing_notices}")
          if "openleo/_web/dist/index.html" not in wheel_names:
              raise SystemExit("wheel is missing the app placeholder page openleo/_web/dist/index.html")
          retired = [name for name in wheel_names if name.startswith("openleo/_web/workbench.")]
          if retired:
              raise SystemExit(f"wheel still carries the v1 workbench frontend: {retired}")
          print(f"distribution members clean: {archives[0]}, {wheels[0]}")
          PY

      - if: matrix.full-checks
        shell: bash
        run: |
          core_env="$(mktemp -d)/venv"
          uv venv --python 3.12 "$core_env"
          uv pip install --python "$core_env/bin/python" dist/*.whl
          "$core_env/bin/python" - <<'PY'
          import importlib.util

          for optional in ("matplotlib", "pyarrow"):
              if importlib.util.find_spec(optional) is not None:
                  raise SystemExit(f"{optional} unexpectedly present in the core-only wheel environment")
          print("core-only wheel environment has neither matplotlib nor pyarrow")
          PY
          "$core_env/bin/openleo" scenario validate examples/scenarios/iss_cartagena.json
          "$core_env/bin/openleo" scenario explain examples/constellations/iridium_global_hydrometeors.json > /dev/null
          "$core_env/bin/openleo" run examples/constellations/iridium_global_reference.json \
            --output "$core_env/reference"
          "$core_env/bin/openleo" sweep examples/sweeps/eirp_oat.json --output "$core_env/eirp"
          "$core_env/bin/openleo" report "$core_env/eirp" --output "$core_env/eirp-report"
          "$core_env/bin/openleo" calc gases examples/atmosphere/p676_13_validation.json \
            --output "$core_env/gases"
          "$core_env/bin/openleo" calc hydrometeors examples/atmosphere/hydrometeors_reference.json \
            --output "$core_env/hydrometeors"
          "$core_env/bin/openleo" verify orbit examples/validation/vallado_06251.json

  slow:
    name: ubuntu / Python 3.12 / slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - run: uv sync --locked --all-extras --group dev

      # The strict 10,000-sample kernel and gas-table sweeps and the full propagation-cases sweep.
      # The 1000-satellite 24-hour benchmark (marker benchmark) has a development-machine bound
      # and is run locally (docs/VALIDATION.md).
      - run: uv run pytest -m "slow and not benchmark"

  packet-replay:
    name: ns-3.48 / analytical packet replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Install compiler and build tools
        run: sudo apt-get update && sudo apt-get install -y g++-14 cmake ninja-build
      - name: Build the pinned optional backend
        env:
          CXX: g++-14
        run: |
          git clone --depth 1 --branch ns-3.48 https://gitlab.com/nsnam/ns-3-dev.git "$RUNNER_TEMP/ns-3.48"
          test "$(git -C "$RUNNER_TEMP/ns-3.48" rev-parse HEAD)" = d2add90b452d600cfb4859baed8e9ea633519447
          cp adapters/ns3/openleo-replay.cc "$RUNNER_TEMP/ns-3.48/scratch/openleo-replay.cc"
          cp adapters/ns3/openleo-network-replay.cc "$RUNNER_TEMP/ns-3.48/scratch/openleo-network-replay.cc"
          cp adapters/ns3/replay-common.h "$RUNNER_TEMP/ns-3.48/scratch/replay-common.h"
          cd "$RUNNER_TEMP/ns-3.48"
          ./ns3 configure --build-profile=release --enable-modules='core;network;internet;point-to-point;applications' --enable-build-version --enable-examples --enable-tests --disable-python-bindings --disable-precompiled-headers --disable-gtk --disable-gsl --disable-werror
          ./ns3 build openleo-replay -j 2
          ./ns3 build openleo-network-replay -j 2
          build/scratch/ns3.48-openleo-replay --PrintVersion
          build/scratch/ns3.48-openleo-network-replay --PrintVersion
      - name: Verify real packet event semantics
        run: uv run python tests/ns3_replay_checks.py "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay"
      - name: Verify native multi-hop event semantics
        run: uv run python tests/ns3_network_checks.py "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay"
      - name: Verify Python-to-simulator integration
        run: OPENLEO_NS3_REPLAY="$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay" OPENLEO_NS3_NETWORK="$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay" uv run pytest tests/replay tests/test_sweep.py tests/test_reproduce.py
      - name: Replay a saved v2 run
        run: |
          uv run openleo run examples/constellations/iridium_global_reference.json --output runs/packet-source
          uv run openleo replay link runs/packet-source --station Madrid --satellite 42960 --duration-s 300 --backend "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-replay" --output runs/packets
          uv run python -c "import json; from pathlib import Path; d=json.loads(Path('runs/packets/packet-summary.json').read_text()); assert len(d['directions']) == 2; assert sum(r['offered_packets'] for r in d['directions']) > 0"
          uv run openleo replay network runs/packet-source --pair Madrid:Tromso --model minimum_delay --duration-s 300 --flows-per-direction 2 --acquisition-delay-s 0.1 --backend "$RUNNER_TEMP/ns-3.48/build/scratch/ns3.48-openleo-network-replay" --output runs/network-packets
          uv run python -c "import json; from pathlib import Path; d=json.loads(Path('runs/network-packets/network-summary.json').read_text()); assert d['aggregate']['offered_packets'] > 0 and d['aggregate']['received_in_window_packets'] > 0"
